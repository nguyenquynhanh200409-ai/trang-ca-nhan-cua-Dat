<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Hình của Đạt</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">VŨ THÀNH ĐẠT <span class="badge">// HANGAR</span></div>
        <nav>
            <a href="index.html">← QUAY LẠI HỒ SƠ</a>
            <a href="page2.html" class="active">MÔ HÌNH & NHẠC</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero-banner">
            <p class="sub-tag">[ COLLECTION GALLERY ]</p>
            <h1>MÔ HÌNH CỦA <span class="highlight-yellow">ĐẠT</span></h1>
        </section>

        <!-- Khu vực 5 ảnh mô hình -->
        <section class="tech-box">
            <div class="box-header">01 // KHO LƯU TRỮ MÔ HÌNH (5 MẪU)</div>
            <div class="gallery-5">
                <div class="img-frame">
                    <img src="images/mh1.jpg" alt="Mô hình 1">
                    <span class="img-label">UNIT-01</span>
                </div>
                <div class="img-frame">
                    <img src="images/mh2.jpg" alt="Mô hình 2">
                    <span class="img-label">UNIT-02</span>
                </div>
                <div class="img-frame">
                    <img src="images/mh3.jpg" alt="Mô hình 3">
                    <span class="img-label">UNIT-03</span>
                </div>
                <div class="img-frame">
                    <img src="images/mh4.jpg" alt="Mô hình 4">
                    <span class="img-label">UNIT-04</span>
                </div>
                <div class="img-frame">
                    <img src="images/mh5.jpg" alt="Mô hình 5">
                    <span class="img-label">UNIT-05</span>
                </div>
            </div>
        </section>

        <!-- Khu vực nhạc Spotify -->
        <section class="tech-box music-box">
            <div class="box-header">02 // AUDIO SYSTEM</div>
            <div class="spotify-wrap">
                <iframe style="border-radius:8px" src="https://open.spotify.com/embed/playlist/4dh33h4vqloLzzolVIZ87l?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
            <p class="chill-text">- Nghe nhạc vui vẻ -</p>
        </section>

        <div class="next-page-area">
            <a href="index.html" class="cyber-btn outline">⬅ TRỞ VỀ TRANG CHỦ</a>
        </div>
    </main>

</body>
</html>
